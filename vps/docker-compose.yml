services:
  sing-box:
    image: ghcr.io/sagernet/sing-box:v1.13.13
    container_name: ss-tunnel-vps
    restart: unless-stopped
    # sing-box runs a VLESS+REALITY inbound and a userspace WireGuard endpoint
    # (system=false, gVisor stack) so it needs no privileged kernel access. Ports
    # must be reachable from the public internet.
    ports:
      - "443:443/tcp"       # VLESS+REALITY (phone -> VPS); real TLS 1.3 to dl.google.com
      - "51820:51820/udp"   # WireGuard listener (home server dials in here)
    volumes:
      - ./sing-box/config.json:/etc/sing-box/config.json:ro
    command: ["-D", "/var/lib/sing-box", "-C", "/etc/sing-box", "run"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
